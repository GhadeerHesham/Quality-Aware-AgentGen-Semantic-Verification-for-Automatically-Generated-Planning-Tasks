<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Search</title>
    <style>
        :root {
            --ink: #17202a;
            --muted: #667085;
            --line: #d8dee8;
            --surface: #f6f8fb;
            --panel: #ffffff;
            --blue: #255db3;
            --red: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 10px;
            margin-top: 18px;
        }

        input,
        button {
            min-height: 40px;
            font: inherit;
        }

        input {
            border: 1px solid var(--line);
            padding: 0 12px;
        }

        button,
        .button {
            border: 1px solid var(--blue);
            color: #ffffff;
            background: var(--blue);
            font-weight: 700;
            cursor: pointer;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 14px;
            text-decoration: none;
        }

        .result,
        .notice {
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 16px;
            margin-top: 14px;
        }

        .notice.error {
            border-color: var(--red);
            color: var(--red);
        }

        .muted {
            color: var(--muted);
        }

        @media (max-width: 560px) {
            .wrap {
                padding: 16px;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap">
            <h1>RAG Search</h1>
            <p class="muted">
                Retrieve AgentGen environments from the source dataset.
            </p>
            <a class="button" href="/">Dashboard</a>
        </div>
    </header>

    <main class="wrap">
        <form action="/search" method="post">
            <input
                type="text"
                name="query"
                value="{{ query }}"
                placeholder="Search for a planning environment"
                required
            >
            <button type="submit">Search</button>
        </form>

        {% if error %}
        <div class="notice error">
            {{ error }}
        </div>
        {% endif %}

        {% if query and not error and not results %}
        <div class="notice">
            No environments found.
        </div>
        {% endif %}

        {% for env in results %}
        <article class="result">
            <h2>{{ env["id"] }}</h2>
            <p>
                {{ env["environment_text"][:1000] }}
            </p>
        </article>
        {% endfor %}
    </main>

</body>

</html>
